spring.application.name=timtro
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

# Refresh token cleanup scheduler (default: run every 6 hours)
app.auth.refresh-token.cleanup.fixed-delay-ms=${REFRESH_TOKEN_CLEANUP_FIXED_DELAY_MS:21600000}
app.auth.refresh-token.cleanup.initial-delay-ms=${REFRESH_TOKEN_CLEANUP_INITIAL_DELAY_MS:120000}